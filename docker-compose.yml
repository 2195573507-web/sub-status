services:
  sub-status:
    build: .
    container_name: sub-status
    ports:
      - "3001:3001"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    environment:
      - PORT=3001
      - STATUS_HEALTH_TARGET=http://host.docker.internal:8080/health
    extra_hosts:
      - "host.docker.internal:host-gateway"
