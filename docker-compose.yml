services:
  sub-status:
    build: .
    container_name: sub-status
    ports:
      - "3001:3001"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    environment:
      - PORT=3001
      - STATUS_HEALTH_TARGET=http://sub2api:8080/health
    networks:
      - default
      - sub2api-network

networks:
  sub2api-network:
    external: true
    name: deploy_sub2api-network
